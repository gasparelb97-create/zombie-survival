name: Pubblica Arena

on:
  push:
    branches: [main]
    paths:
      - 'arena/**'
      - '.github/workflows/arena-deploy.yml'
      - '.github/scripts/arena-release.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica Arena
        run: node --test arena/logic.test.mjs
      - name: Prepara il Worker
        run: npx --yes wrangler@4.148.0 deploy --dry-run --config arena/wrangler.toml
      - name: Controlla collegamento Cloudflare
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Pubblicazione non eseguita: configura CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nei segreti del repository.'
            echo 'Arena non pubblicata: manca il collegamento Cloudflare.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Pubblica su Cloudflare
        if: steps.credentials.outputs.configured == 'true'
        run: npx --yes wrangler@4.148.0 deploy --config arena/wrangler.toml
      - name: Registra versione pubblicata
        if: steps.credentials.outputs.configured == 'true'
        continue-on-error: true
        run: npx --yes wrangler@4.148.0 deployments list --config arena/wrangler.toml
      - name: Verifica versione online
        if: steps.credentials.outputs.configured == 'true'
        run: python3 .github/scripts/arena-release.py verify
      - name: Notifica personale Telegram
        if: steps.credentials.outputs.configured == 'true'
        env:
          TELEGRAM_NOTIFY_BOT_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_BOT_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
        run: python3 .github/scripts/arena-release.py notify
