<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0b0d12">
<title>Zombie Survival</title>
<style>html,body{margin:0;height:100%;background:#0b0d12;color:#e7edf5;font:600 15px system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div>Carico Zombie Survival…</div>
<script>
(function(){
  var path=location.pathname.replace(/[^/]*$/,'');
  var started=false;
  function saveTg(){
    try{
      var W=window.Telegram&&window.Telegram.WebApp;
      if(W&&W.ready)try{W.ready();}catch(e){}
      var s=(W&&W.initData)||'';
      if(!s){var m=(location.hash||'').match(/tgWebAppData=([^&]+)/);if(m)s=decodeURIComponent(m[1]);}
      if(s&&s.indexOf('hash=')>=0)sessionStorage.setItem('zs_tg425',s);
    }catch(e){}
  }
  function go(ver){
    saveTg();
    var q=new URLSearchParams(location.search);
    if(ver)q.set('v',ver);
    q.set('nc',String(Date.now()));
    location.replace(path+'game.html?'+q.toString()+location.hash);
  }
  function start(){
    if(started)return;started=true;saveTg();
    var nc=Date.now();
    fetch(path+'version.txt?nc='+nc,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
      t=(t||'').trim();
      if(!/^\d+\.\d+\.\d+$/.test(t))throw 0;
      go(t);
    }).catch(function(){go('');});
  }
  if(window.__zsApk||/[?&]apk=1(?:&|$)/.test(location.search)){start();return;}
  if(window.Telegram&&window.Telegram.WebApp)start();
  else{
    var s=document.createElement('script');
    s.src='https://telegram.org/js/telegram-web-app.js';
    s.onload=start;s.onerror=start;
    document.head.appendChild(s);
    setTimeout(start,1200);
  }
})();
</script>
</body>
</html>
